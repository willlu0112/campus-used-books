<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>校園二手書拍賣平台 - 主頁</title>
</head>

<body>
    <h1>歡迎來到校園二手書拍賣平台！</h1>

    <div style="background-color: #f1f1f1; padding: 10px; margin-bottom: 20px;">
        <div sec:authorize="isAnonymous()">
            <span>您目前是訪客狀態：</span>
            <a href="/login-page"><button type="button">會員登入</button></a>
            <a href="/register-page"><button type="button">註冊新帳號</button></a>
        </div>

        <div sec:authorize="isAuthenticated()">
            <span>歡迎回來，會員：<strong sec:authentication="name" style="color: blue;">用戶名</strong> ！</span>
            <form action="/logout" method="post" style="display: inline;">
                <button type="submit"
                    style="background-color: #f44336; color: white; border: none; padding: 5px 10px; cursor: pointer;">安全登出</button>
            </form>
        </div>
    </div>

    <a href="/add-page">
        <button type="button"
            style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; cursor: pointer;">
            ➕ 點我上架新二手書
        </button>
    </a>

    <a href="/cart">
        <button type="button"
            style="padding: 10px 20px; font-size: 16px; background-color: #ff9800; color: white; border: none; cursor: pointer; margin-left: 10px;">
            🛒 查看我的購物車
        </button>
    </a>

    <a href="/orders">
        <button type="button"
            style="padding: 10px 20px; font-size: 16px; background-color: #1890ff; color: white; border: none; cursor: pointer; margin-left: 10px;">
            📦 查詢我的訂單
        </button>
    </a>

    <br><br>
    <hr>

    <div style="background-color: #e6f7ff; padding: 15px; margin-bottom: 20px; border-radius: 5px;">
        <h3>🔍 快速搜尋二手書</h3>
        <form action="/search" method="get">
            <label>搜尋類型：</label>
            <select name="type" style="padding: 5px; font-size: 14px;">
                <option value="title">依【書名】搜尋</option>
                <option value="course">依【課程名稱】搜尋</option>
                <option value="professor">依【指導教授】搜尋</option>
            </select>

            <input type="text" name="keyword" placeholder="請輸入關鍵字..." required
                style="padding: 5px; width: 250px; font-size: 14px; margin-left: 10px;">

            <button type="submit"
                style="padding: 5px 15px; background-color: #1890ff; color: white; border: none; cursor: pointer; margin-left: 10px;">
                開始搜尋
            </button>
        </form>
    </div>

    <h2>目前架上的二手書</h2>
    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>編號</th>
                <th>書本封面</th>
                <th>書名</th>
                <th>價格</th>
                <th>作者</th>
                <th>對應課程</th>
                <th>指導教授</th>
                <th>功能操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>

                <td>
                    <img th:src="@{'/uploads/' + ${book.coverImage}}" alt="書本封面"
                        style="width: 80px; height: auto; border-radius: 4px; box-shadow: 1px 1px 5px rgba(0,0,0,0.1);">
                </td>

                <td th:text="${book.title}">測試書名</td>
                <td th:text="${book.price}">100</td>
                <td th:text="${book.author}">測試作者</td>
                <td th:text="${book.courseName}">測試課程</td>
                <td th:text="${book.professor}">測試教授</td>
                <td>
                    <form th:action="@{/cart/add}" method="post" style="display: inline;">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <button type="submit"
                            style="background-color: #ff9800; color: white; border: none; padding: 3px 8px; cursor: pointer; border-radius: 3px;">🛒
                            加入購物車</button>
                    </form>

                    <a th:href="@{/comments(courseName=${book.courseName}, professor=${book.professor})}"
                        style="text-decoration: none; margin-left: 5px;">
                        <button type="button"
                            style="background-color: #17a2b8; color: white; border: none; padding: 3px 8px; cursor: pointer; border-radius: 3px;">💬
                            課程評價</button>
                    </a>

                    <form action="/editBook" method="get" style="display: inline;"
                        th:if="${#authorization.expression('isAuthenticated()') and #authentication.name == book.ownerUsername}">
                        <input type="hidden" name="id" th:value="${book.id}">
                        <button type="submit" style="margin-left: 5px;">編輯修改</button>
                    </form>

                    <form action="/deleteBook" method="post" style="display: inline;"
                        th:if="${#authorization.expression('isAuthenticated()') and #authentication.name == book.ownerUsername}">
                        <input type="hidden" name="id" th:value="${book.id}">
                        <button type="submit" style="color: red; margin-left: 5px;">下架刪除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
