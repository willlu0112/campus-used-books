<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的購物車</title>
</head>
<body>
    <h1>我的購物車</h1>
    <a th:href="@{/}">回到首頁</a>

    <table border="1" style="margin-top: 20px;">
        <tr>
            <th>書名</th>
            <th>價格</th>
            <th>操作</th>
        </tr>
        <tr th:each="item : ${cartItems}">
            <td th:text="${item.book.title}">書名</td>
            <td th:text="${item.book.price}">價格</td>
            <td>
                <form th:action="@{/cart/remove}" method="post">
                    <input type="hidden" name="cartItemId" th:value="${item.id}">
                    <button type="submit">移除</button>
                </form>
            </td>
        </tr>
    </table>

    <h3 style="color: red;">總金額: <span th:text="${totalPrice}">0</span> 元</h3>
    <form th:action="@{/checkout}" method="post" style="margin-top: 20px;">
    <button type="submit" style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px;">確認結帳</button>
    </form>
</body>
</html>
